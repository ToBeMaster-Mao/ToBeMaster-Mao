name: Generate sakura contribution snake

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate sakura snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ToBeMaster-Mao
          # Empty day, then four contribution levels; match 浮生's sakura palette.
          outputs: |
            dist/github-contribution-grid-snake-sakura.svg?palette=github-light&color_snake=%23a93462&color_dots=%23f9e9f0,%23f7c9d9,%23f4a7b9,%23e58aa2,%23c95f87
            dist/github-contribution-grid-snake-sakura-dark.svg?palette=github-dark&color_snake=%23ffe0ec&color_dots=%23241923,%23563044,%23874763,%23bf668d,%23f4a7b9

      - name: Publish snake SVG
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
