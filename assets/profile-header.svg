<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
  <title id="title">LazyCatttt profile header</title>
  <desc id="desc">A warm cream and sakura pink profile banner with delicate blossoms, aqua and honey gold details.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfb"/>
      <stop offset="0.55" stop-color="#fff7fa"/>
      <stop offset="1" stop-color="#f8fbfb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#df5a8b"/>
      <stop offset="0.53" stop-color="#c99d45"/>
      <stop offset="1" stop-color="#2daaaa"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#df5a8b" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#df5a8b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="paper-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7f4d64" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <g id="sakura">
      <path d="M0-3C-12-13-10-26 0-31C10-26 12-13 0-3Z"/>
      <path d="M0-3C-12-13-10-26 0-31C10-26 12-13 0-3Z" transform="rotate(72)"/>
      <path d="M0-3C-12-13-10-26 0-31C10-26 12-13 0-3Z" transform="rotate(144)"/>
      <path d="M0-3C-12-13-10-26 0-31C10-26 12-13 0-3Z" transform="rotate(216)"/>
      <path d="M0-3C-12-13-10-26 0-31C10-26 12-13 0-3Z" transform="rotate(288)"/>
      <circle r="4.5"/>
    </g>
    <path id="petal" d="M0 0C-8-4-10-13-4-18C4-16 8-8 0 0Z"/>
  </defs>

  <rect x="1" y="1" width="898" height="238" rx="22" fill="url(#paper)" stroke="#d9a6bc" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="236" rx="21" fill="url(#paper-grid)"/>
  <ellipse cx="764" cy="115" rx="151" ry="139" fill="url(#blush)"/>
  <circle cx="770" cy="112" r="78" fill="#fffdfb" fill-opacity="0.38" stroke="#df5a8b" stroke-opacity="0.12"/>
  <circle cx="770" cy="112" r="66" fill="none" stroke="#c99d45" stroke-opacity="0.17"/>

  <path d="M40 52V188" stroke="#df5a8b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="40" cy="45" r="3.5" fill="#2daaaa"/>
  <circle cx="40" cy="195" r="3.5" fill="#c99d45"/>

  <text x="70" y="58" fill="#b7406c" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3.1">PERSONAL NOTES · AI CRAFT</text>
  <text x="68" y="116" fill="#4a1d31" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="750" letter-spacing="0.8">LazyCatttt</text>
  <rect x="70" y="130" width="410" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="70" y="158" fill="#704357" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="600" letter-spacing="1.25">AI Tooling · Multimodal Services · Agent Workflows</text>

  <g transform="translate(70 177)">
    <rect width="132" height="30" rx="15" fill="#fffafd" stroke="#df5a8b" stroke-opacity="0.38"/>
    <circle cx="16" cy="15" r="4" fill="#2daaaa"/>
    <text x="29" y="20" fill="#8e365a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="700" letter-spacing="1">浮生 / 在路上</text>
  </g>
  <path d="M221 192H492" stroke="#9a6079" stroke-opacity="0.18"/>
  <circle cx="502" cy="192" r="2.5" fill="#c99d45"/>

  <g fill="none" stroke-linecap="round">
    <path d="M626 205C680 184 707 150 738 120C765 94 799 69 856 48" stroke="#9c6f3a" stroke-opacity="0.56" stroke-width="2.2"/>
    <path d="M706 153C689 134 678 117 677 96" stroke="#9c6f3a" stroke-opacity="0.42" stroke-width="1.6"/>
    <path d="M768 93C789 102 808 111 828 130" stroke="#9c6f3a" stroke-opacity="0.38" stroke-width="1.5"/>
  </g>

  <g transform="translate(752 107) scale(.92)" fill="#f9c9da" stroke="#cf4d7c" stroke-width="1.2">
    <use href="#sakura"/>
  </g>
  <g transform="translate(826 63) scale(.56)" fill="#fff1cb" stroke="#ba8c34" stroke-width="1.8">
    <use href="#sakura"/>
  </g>
  <g transform="translate(682 104) scale(.42)" fill="#dff5f3" stroke="#2b9290" stroke-width="2.1">
    <use href="#sakura"/>
  </g>

  <g fill="#df5a8b" fill-opacity="0.48">
    <use href="#petal" transform="translate(844 152) rotate(38) scale(.62)"/>
    <use href="#petal" transform="translate(797 180) rotate(-18) scale(.48)"/>
    <use href="#petal" transform="translate(647 83) rotate(68) scale(.42)"/>
  </g>
  <g fill="none" stroke="#2daaaa" stroke-linecap="round" stroke-opacity="0.6">
    <path d="M862 181v14M855 188h14"/>
    <path d="M615 68v10M610 73h10"/>
  </g>
  <text x="855" y="218" text-anchor="end" fill="#8a526a" fill-opacity="0.55" font-family="Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="2">SOMEWHERE ALONG THE WAY</text>
</svg>
